name: Code QA
on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      node-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Run linting
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Run type checking
        run: npm run typecheck

  list-templates:
    name: List templates
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: List templates
        id: list
        run: printf 'templates=%s\n' "$(bin/vblocks init --list | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  integration-test:
    name: Integration Test (${{ matrix.template }})
    needs: [list-templates]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.list-templates.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ inputs.cache-key }}

      - name: Run integration tests
        env:
          TEMPLATE: ${{ matrix.template }}
        run: npm run integration-test -- "$TEMPLATE"
